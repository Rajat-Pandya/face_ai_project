name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m py_compile main.py gui/app.py gui/interface.py src/__init__.py src/camera.py src/face_detection.py src/mask_detection.py src/emotion_detection.py src/hand_detection.py src/object_detection.py src/real_time_detection.py src/stats.py src/model_loader.py src/train_emotion_model.py src/train_mask_model.py

      - name: Run tests
        run: |
          pytest
